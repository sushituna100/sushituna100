[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wyckoff-bot"
version = "0.1.0"
description = "A Wyckoff-method swing-trading strategy engine with multi-indicator confirmation and hard risk controls, designed to drive Robinhood agentic (MCP) execution."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shishir" }]
keywords = ["wyckoff", "trading", "robinhood", "technical-analysis", "swing-trading"]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
wyckoff-bot = "wyckoff_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
