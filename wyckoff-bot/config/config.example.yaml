# Wyckoff-bot configuration. Every key is optional — anything omitted keeps its
# built-in default. Copy to config.yaml and edit. Load with: --config config.yaml
# (YAML needs PyYAML; a .json file with the same shape works with no dependencies.)

# The instruments to scan. Wyckoff needs liquidity + institutional participation.
# This default mixes broad-index and commodity ETFs — all liquid, all crowd-driven,
# none exposed to single-company headline risk. Trade DAILY bars.
universe:
  - SPY    # S&P 500 — deepest liquidity, cleanest structures
  - QQQ    # Nasdaq 100
  - IWM    # Russell 2000 (small caps — more sentiment-driven)
  - GLD    # Gold  (commodity ETF; textbook Wyckoff swing vehicle)
  - SLV    # Silver
  - USO    # Crude oil
  - GDX    # Gold miners
  - XLE    # Energy sector

allow_short: false        # equities: long-only by default (shorting needs margin)
entry_slippage: 0.0015    # marketable-limit cushion vs. reference price
max_plans: 5              # cap actionable proposals per run

# --- Wyckoff structure detection (relative units; tune per instrument) --------
wyckoff:
  range_lookback: 40       # bars used to define the trading range body
  trigger_bars: 5          # recent bars scanned for a trigger event
  pre_trend_lookback: 25   # bars before the range used to classify context
  vol_avg_period: 20       # trailing window for relative volume
  atr_period: 14
  trend_pct: 0.08          # pre-range move (±) to call accumulation/distribution
  climax_vol_mult: 1.8     # volume vs. average to call a climax
  wide_spread_mult: 1.5    # bar range vs. ATR to call a spread "wide"
  min_penetration_atr: 0.10  # how far past support/resistance a spring/upthrust pokes
  dry_vol_mult: 0.85       # volume below this * average == "dried up"
  sos_vol_mult: 1.3        # expanding volume for a breakout/breakdown

# --- Confirmation + signal thresholds ----------------------------------------
signal:
  ema_trend: 30
  ema_fast: 10
  rsi_period: 14
  mfi_period: 14
  stop_buffer_atr: 0.5     # ATR cushion beyond the structural stop
  min_reward_risk: 1.8     # trades below this reward:risk are flagged, not sized
  min_confirmations: 2     # independent confirmations required to act
  min_confidence: 0.55     # composite score required to act

# --- Risk management (the real safety) ---------------------------------------
risk:
  account_equity: 10000.0
  risk_per_trade_pct: 0.005   # 0.5% of equity risked to the stop, per trade
  max_position_pct: 0.20      # <=20% of equity in one name
  max_open_positions: 5
  max_portfolio_risk_pct: 0.02  # <=2% total open risk across the book
  max_daily_loss_pct: 0.03      # kill switch: halt new entries for the day
  allow_fractional: true
